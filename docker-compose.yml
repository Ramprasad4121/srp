services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "6969:6969"
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=development

  foundry:
    image: ghcr.io/foundry-rs/foundry:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
