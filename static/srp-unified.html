<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP — Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/ProtocolTheater.js"></script>
<style>
:root {
  --bg:#050505; --bg-surface:#0a0a0a; --bg-card:#0f0f0f;
  --border:#1a1a1a; --border-bright:#2a2a2a;
  --text:#e0e0e0; --text-dim:#666; --text-muted:#444;
  --accent:#00ff88; --accent-dim:rgba(0,255,136,0.15);
  --red:#ff4444; --red-dim:rgba(255,68,68,0.15);
  --amber:#ffaa00; --amber-dim:rgba(255,170,0,0.15);
  --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.header { height:60px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
.logo { font-family:var(--mono); font-weight:700; color:var(--accent); font-size:1.2rem; }
.status { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); }
.status-dot { width:8px; height:8px; background:var(--accent); border-radius:50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

.main { display:flex; flex:1; overflow:hidden; }

/* Mission Control (Left) */
.mission-control { width:300px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); }
.panel-label { font-family:var(--mono); font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px; padding:16px 20px; border-bottom:1px solid var(--border); }
.log-stream { flex:1; overflow-y:auto; padding:10px 0; font-family:var(--mono); font-size:0.7rem; }
.log-line { padding:4px 20px; display:flex; gap:10px; border-bottom:1px solid rgba(255,255,255,0.02); }
.log-agent { color:var(--accent); font-weight:600; min-width:70px; }

/* SRG Graph (Center) */
.srg-canvas { flex:1; background:var(--bg); position:relative; overflow:hidden; }
#theater-container { width:100%; height:100%; }

/* Deep Dive (Right) */
.deep-dive { width:350px; border-left:1px solid var(--border); background:var(--bg-surface); display:flex; flex-direction:column; }
.deep-dive-content { padding:24px; flex:1; overflow-y:auto; }
.finding-title { font-family:var(--mono); font-weight:700; color:var(--red); margin-bottom:12px; }
.finding-meta { font-size:0.75rem; color:var(--text-dim); margin-bottom:20px; }
.tab-container { display:flex; border-bottom:1px solid var(--border); }
.tab { padding:10px 16px; font-family:var(--mono); font-size:0.65rem; color:var(--text-muted); cursor:pointer; }
.tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }

.footer { height:30px; border-top:1px solid var(--border); display:flex; align-items:center; padding:0 24px; font-family:var(--mono); font-size:0.6rem; color:var(--text-muted); flex-shrink:0; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">SRP // MISSION CONTROL</div>
  <div style="display:flex; align-items:center; gap:20px;">
    <button id="start-audit-btn" style="background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); font-family:var(--mono); font-size:0.6rem; padding:4px 12px; cursor:pointer; border-radius:4px; text-transform:uppercase; letter-spacing:1px;">Start New Audit</button>
    <div class="status">
      <div class="status-dot"></div>
      <span id="status-text">AUDITING: <span id="project-label">PROJECT</span></span>
    </div>
  </div>
</header>

<div class="main">
  <aside class="mission-control">
    <div class="panel-label">Mission Control</div>
    <div class="log-stream" id="log-stream">
      <div class="log-line"><span class="log-agent">SYSTEM</span> <span>Initializing expert audit protocol...</span></div>
    </div>
  </aside>

  <section class="srg-canvas">
    <div id="theater-container"></div>
  </section>

  <aside class="deep-dive">
    <div class="panel-label">Intelligence Handoff</div>
    <div id="notes-view" class="deep-dive-content">
      <div class="finding-title" id="active-note-title">Reconnaissance Notes</div>
      <div id="active-note-content" style="font-family:var(--mono); font-size:0.75rem; color:var(--text-dim); line-height:1.6;">
        Waiting for Phase 1 output...
      </div>
    </div>
  </aside>
</div>

<footer class="footer" id="footer-status">
  PHASE: INITIALIZING | SRG: 0 NODES | MCP: 13 AGENTS | SYSTEM: STABLE
</footer>

<script>
  let theater;
  const stream = document.getElementById('log-stream');
  
  function addLog(agent, msg) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-agent">${agent}</span> <span>${msg}</span>`;
    stream.appendChild(line);
    stream.scrollTop = stream.scrollHeight;
  }

  function updateIntentUI(data) {
    document.getElementById('active-note-title').textContent = 'Phase 1: Reconnaissance';
    const summary = data.summary || '';
    const invariants = data.invariants || [];
    document.getElementById('active-note-content').innerHTML = `
      <p>${summary}</p><br>
      <p><strong>PROMISES IDENTIFIED:</strong></p>
      <ul>${invariants.map(i => `<li>${i.description}</li>`).join('')}</ul>
    `;
    document.getElementById('project-label').textContent = data.protocol_name || 'PROJECT';
  }

  // SSE Listener
  const eventSource = new EventSource('/stream');
  eventSource.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    if (data.event === 'sync') {
      // Clear and populate logs
      stream.innerHTML = '';
      data.data.logs.forEach(log => {
        // Extract agent name if present in [AGENT] format
        const match = log.match(/^[^\[]*\[([^\]]+)\] (.*)/);
        if (match) {
          addLog(match[1], match[2]);
        } else {
          addLog('SYSTEM', log);
        }
      });
      
      // Update other UI elements if intent/plan ready
      if (data.data.protocol_intent) {
        updateIntentUI(data.data.protocol_intent);
      }
      return;
    }

    if (data.event === 'intent_ready') {
      updateIntentUI(data.data);
      return;
    }
    
    if (data.event === 'agent_start') {
      addLog(data.agent, 'Analyzing protocol logic...');
    }
    
    if (data.event === 'step') {
      addLog(data.agent, data.data.step || data.data.status);
      
      // Update Diagrams from DiagramEngine data
      if (data.agent === 'Phase5:Diagrams' && data.data.details && data.data.details.system_map) {
        theater.renderSystemMap(data.data.details.system_map);
      }
    }

    if (data.event === 'agent_complete') {
      addLog(data.agent, 'Phase complete.');
      
      // Expert Note Handoff
      if (data.agent === 'IntentAgent' || data.agent === 'Phase1:Recon') {
        updateIntentUI(data.data.protocol_intent || data.data);
      }
      if (data.agent === 'ReconAgent' || data.agent === 'Phase2:Mapping') {
        document.getElementById('active-note-title').textContent = 'Phase 2: Architecture Mapping';
        const contracts = data.data.contracts || [];
        const external = data.data.external_calls || [];
        document.getElementById('active-note-content').innerHTML = `
          <p><strong>CONTRACTS:</strong> ${contracts.join(', ')}</p><br>
          <p><strong>TRUST BOUNDARIES:</strong></p>
          <ul>${external.map(c => `<li>${c}</li>`).join('')}</ul>
        `;
      }
      if (data.agent === 'AttackAgent' || data.agent === 'Phase3:Notes') {
        document.getElementById('active-note-title').textContent = 'Phase 3: Attack Hypotheses';
        const hypotheses = data.data.hypotheses || 'Generating hypotheses...';
        document.getElementById('active-note-content').innerHTML = `
          <p><strong>HUNTING LIST (Top 20-30):</strong></p><br>
          ${hypotheses}
        `;
      }
    }

    if (data.event === 'broadcast' && data.type === 'value_flow') {
      theater.animateValueFlow(data.data);
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    theater = new ProtocolTheater('theater-container');

    document.getElementById('start-audit-btn').addEventListener('click', () => {
      const contract = prompt("Enter contract path or code:", "contracts/SRPBudget.sol");
      if (contract) {
        fetch('/api/audit/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contract_code: contract, description: `Audit of ${contract}` })
        }).then(r => r.json()).then(data => {
          if (data.status === 'started') {
            addLog('SYSTEM', '🚀 Manual audit trigger accepted.');
          } else {
            alert('Error: ' + (data.error || 'Failed to start audit'));
          }
        });
      }
    });
  });
</script>
</body>
</html>
