<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SRP Security Operations Dashboard — Enterprise-grade security reasoning protocol management, audit orchestration, and real-time incident monitoring." />
    <meta name="theme-color" content="#060810" />
    <meta name="color-scheme" content="dark" />
    <title>SRP — Security Operations Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <!-- Brand -->
        <div class="sidebar-brand">
          <div class="brand-logo" id="brand-logo">
            <div class="brand-mark">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="brand-text">
              <span class="brand-name">SRP</span>
              <span class="brand-tagline">Security Reasoning Protocol</span>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav" id="sidebar-nav">
          <div class="nav-section-label">Operations</div>
          <a href="#dashboard" class="nav-item active" id="nav-dashboard" data-route="dashboard">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </span>
            <span class="nav-label">Dashboard</span>
            <span class="nav-indicator"></span>
          </a>
          <a href="#new-audit" class="nav-item" id="nav-new-audit" data-route="new-audit">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
            </span>
            <span class="nav-label">New Audit</span>
            <span class="nav-indicator"></span>
          </a>
          <a href="#audits" class="nav-item" id="nav-audits" data-route="audits">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
            </span>
            <span class="nav-label">Audits</span>
            <span class="nav-indicator"></span>
          </a>
          <a href="#findings" class="nav-item" id="nav-findings" data-route="findings">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </span>
            <span class="nav-label">Findings</span>
            <span class="nav-indicator"></span>
          </a>

          <div class="nav-section-label">Intelligence</div>
          <a href="#monitoring" class="nav-item" id="nav-monitoring" data-route="monitoring">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
            </span>
            <span class="nav-label">Monitoring</span>
            <span class="nav-indicator"></span>
          </a>
          <a href="#reports" class="nav-item" id="nav-reports" data-route="reports">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>
            </span>
            <span class="nav-label">Reports</span>
            <span class="nav-indicator"></span>
          </a>
          <a href="#audit-log" class="nav-item" id="nav-audit-log" data-route="audit-log">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
            </span>
            <span class="nav-label">Audit Log</span>
            <span class="nav-badge" id="nav-badge-admin">Admin</span>
            <span class="nav-indicator"></span>
          </a>

          <div class="nav-section-label">System</div>
          <a href="#settings" class="nav-item" id="nav-settings" data-route="settings">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </span>
            <span class="nav-label">Settings</span>
            <span class="nav-indicator"></span>
          </a>
        </nav>

        <!-- Connection Status -->
        <div class="sidebar-footer">
          <div class="connection-status" id="connection-status">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-text">Connecting...</span>
          </div>
          <div class="sidebar-version">SRP v2.0 — SOC Dashboard</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Top Bar -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger-btn" aria-label="Toggle sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle" class="topbar-subtitle">Security operations overview</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-live-indicator" id="live-indicator">
            <span class="live-dot"></span>
            <span>LIVE</span>
          </div>
          <div class="topbar-role" id="topbar-role">Admin</div>
        </div>
      </header>

      <!-- Router View -->
      <div id="router-view" class="router-view">
        <!-- Views are rendered here by the router -->
        <div class="view-loading" id="view-loading">
          <div class="loading-spinner">
            <div class="spinner-ring"></div>
          </div>
          <p>Loading...</p>
        </div>
      </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/app.js"></script>
  </body>
</html>
