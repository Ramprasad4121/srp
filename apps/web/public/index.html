<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>document.documentElement.dataset.theme = localStorage.getItem("srp.theme") || "light";</script>
    <title>SRP Console</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/overview">
          <span class="logo" aria-hidden="true">S</span>
          <div><strong>SRP</strong><small>Security Reasoning Protocol</small></div>
        </a>
        <nav aria-label="Main">
          <a href="#/overview" data-nav="overview"><span class="ico" aria-hidden="true">◐</span>Overview</a>
          <a href="#/scan" data-nav="scan"><span class="ico" aria-hidden="true">✦</span>New Scan</a>
          <a href="#/findings" data-nav="findings"><span class="ico" aria-hidden="true">◎</span>Findings</a>
          <a href="#/battlechain" data-nav="battlechain"><span class="ico" aria-hidden="true">⚔</span>BattleChain</a>
          <a href="#/tools" data-nav="tools"><span class="ico" aria-hidden="true">⌘</span>Analyzers</a>
          <a href="#/reports" data-nav="reports"><span class="ico" aria-hidden="true">▤</span>Reports</a>
          <a href="#/monitoring" data-nav="monitoring"><span class="ico" aria-hidden="true">◉</span>Monitoring</a>
          <a href="#/settings" data-nav="settings"><span class="ico" aria-hidden="true">⚙</span>Settings</a>
        </nav>
        <div class="sidebar-foot">
          <label class="toggle">
            <span>Demo mode</span>
            <input type="checkbox" id="demoToggle">
          </label>
          <label class="toggle">
            <span>Dark mode</span>
            <input type="checkbox" id="themeToggle">
          </label>
          <p class="conn" role="status" aria-live="polite"><span id="connDot" class="dot"></span><span id="connStatus">Checking API...</span></p>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn" id="menuBtn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
          <h1 id="viewTitle">Overview</h1>
          <span id="modeBadge" class="badge"></span>
        </header>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="mock-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
